    <!-- Blocking Flash-Free Theme Script (Blueprint Section 10) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('apex_react_theme') || 'dark';
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090a10] text-slate-900 dark:text-[#f8fafc] antialiased selection:bg-indigo-500 selection:text-white min-h-screen transition-colors duration-200">

    <script type="module" src="/src/main.jsx"></script>
  </body>
